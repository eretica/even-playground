<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" font-family="'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="g" orient="auto" markerWidth="10" markerHeight="10" refX="8" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#1b7f3b"/></marker>
    <marker id="a" orient="auto" markerWidth="10" markerHeight="10" refX="8" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#e2a63a"/></marker>
  </defs>
  <!-- row 1: fast -->
  <rect x="0" y="0" width="340" height="170" rx="16" fill="#ffffff" stroke="#d8e2da"/>
  <text x="24" y="40" font-size="22" fill="#6b7a71">毎回</text>
  <text x="24" y="86" font-size="30" font-weight="700" fill="#122018">発話が届く</text>
  <text x="24" y="128" font-size="22" fill="#3d4a43">4 秒ごとの文字起こし</text>
  <line x1="340" y1="85" x2="420" y2="85" stroke="#1b7f3b" stroke-width="4" marker-end="url(#g)"/>
  <rect x="430" y="0" width="520" height="170" rx="16" fill="#0e1713"/>
  <text x="454" y="40" font-size="22" fill="#35d96a" font-family="'JetBrains Mono',monospace">fast · 0.2〜0.5 秒</text>
  <text x="454" y="86" font-size="30" font-weight="700" fill="#f3f6f1">Jev が 9 問を判定</text>
  <text x="454" y="128" font-size="22" fill="#c9d6cd">直近 6 発話 + 要約メモだけ渡す</text>
  <line x1="950" y1="85" x2="1030" y2="85" stroke="#1b7f3b" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1040" y="0" width="560" height="170" rx="16" fill="#ffffff" stroke="#1b7f3b" stroke-width="3"/>
  <text x="1064" y="40" font-size="22" fill="#1b7f3b">グラスを即更新</text>
  <text x="1064" y="86" font-size="30" font-weight="700" fill="#122018">ゲージ · 顔 · 一言ラベル</text>
  <text x="1064" y="128" font-size="22" fill="#3d4a43">confidence が低ければ前回の値を保持</text>
  <!-- row 2: text -->
  <rect x="0" y="230" width="340" height="170" rx="16" fill="#ffffff" stroke="#d8e2da"/>
  <text x="24" y="270" font-size="22" fill="#6b7a71">条件つき</text>
  <text x="24" y="316" font-size="30" font-weight="700" fill="#122018">変化があった?</text>
  <text x="24" y="358" font-size="22" fill="#3d4a43">顔が変わる / 総合 ±15 / 30 秒</text>
  <line x1="340" y1="315" x2="420" y2="315" stroke="#e2a63a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="430" y="230" width="520" height="170" rx="16" fill="#0e1713"/>
  <text x="454" y="270" font-size="22" fill="#e2a63a" font-family="'JetBrains Mono',monospace">text · 8〜10 秒</text>
  <text x="454" y="316" font-size="30" font-weight="700" fill="#f3f6f1">Claude が文章だけ書く</text>
  <text x="454" y="358" font-size="22" fill="#c9d6cd">Jev の判定を前提に、セッション継続で</text>
  <line x1="950" y1="315" x2="1030" y2="315" stroke="#e2a63a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1040" y="230" width="560" height="170" rx="16" fill="#ffffff" stroke="#e2a63a" stroke-width="3"/>
  <text x="1064" y="270" font-size="22" fill="#b07a1e">届いたら差し替え</text>
  <text x="1064" y="316" font-size="30" font-weight="700" fill="#122018">次の一言 · 深掘り · 要約</text>
  <text x="1064" y="358" font-size="22" fill="#3d4a43">数値はそのまま、文章欄だけ更新</text>
</svg>
