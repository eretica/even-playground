  <text x="160" y="98" text-anchor="middle" font-size="24" fill="#c9d6cd">マイク + 表示</text>
  <rect x="448" y="0" width="320" height="130" rx="16" fill="#ffffff" stroke="#1b7f3b" stroke-width="3"/>
