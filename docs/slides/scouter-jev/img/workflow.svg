  <text x="0" y="548" font-size="24" fill="#3d4a43">3 つのサービスはすべて Mac 1 台のプロキシ越し。音声は BLE でスマホへ、スマホからは 4 秒ごとの HTTP POST。鍵はプロキシの .env にだけ</text>
